name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Gradle 9.7.1
        run: |
          curl -sL --fail --retry 5 --retry-delay 10 --retry-all-errors https://services.gradle.org/distributions/gradle-9.7.1-bin.zip -o /tmp/gradle.zip || curl -sL --fail --retry 5 --retry-delay 10 --retry-all-errors https://downloads.gradle-dn.com/distributions/gradle-9.7.1-bin.zip -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d $HOME
          echo "$HOME/gradle-9.7.1/bin" >> $GITHUB_PATH

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YTXTube-Fix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
